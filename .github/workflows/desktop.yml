# Builds the Windows installer, installs it, and starts the installed app once.
#
# A tag `v<version>`, or a manual run with "release" ticked, additionally publishes the tested installer as a GitHub
# release — under its versioned name and as `Sondra-Setup.exe`, which the
# website links through `releases/latest/download/Sondra-Setup.exe`. Path
# filters are not evaluated for tag pushes, so a tag always builds.
#
# Everything runs on windows-latest: an NSIS installer needs Windows to build,
# and "the installed app opens and shows Sondra" is only worth something when
# it was checked on Windows. The installer is kept as the artifact
# "Sondra-Setup" — download, unpack, run Sondra-Setup-<version>.exe.

name: Desktop

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - desktop/**
      - scripts/build-desktop.mjs
      - api/**
      - src/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - .github/workflows/desktop.yml
  workflow_dispatch:
    inputs:
      release:
        description: 'Setup als GitHub Release v<Version aus package.json> veröffentlichen'
        type: boolean
        default: false
      store:
        description: 'Setup auf Vercel Blob legen (Paket-URL ohne Umleitung für den Microsoft Store)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      # Write only for the release step on a tag; nothing else pushes.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build:desktop

      - name: Install silently and start the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter 'Sondra-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Kein Setup gebaut.' }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait

          $app = Join-Path $env:LOCALAPPDATA 'Programs\Sondra\Sondra.exe'
          if (-not (Test-Path $app)) { throw "Nicht installiert: $app fehlt." }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Programs\Sondra\LIZENZ.txt'))) { throw 'LIZENZ.txt fehlt im Installationsordner.' }

          # Twice: the second start runs against the profile the first one left
          # behind, which is where a start that works once and then fails lives.
          $report = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $env:SONDRA_SMOKE = $report
          # The installer may start the app when it finishes; the test wants its own start.
          Start-Sleep -Seconds 3
          Get-Process Sondra -ErrorAction SilentlyContinue | Stop-Process -Force
          foreach ($run in 1..2) {
            Remove-Item $report -ErrorAction SilentlyContinue
            $process = Start-Process -FilePath $app -PassThru
            if (-not $process.WaitForExit(90000)) { $process.Kill(); throw "Start ${run}: Sondra hat sich nicht wieder beendet." }
            if (-not (Test-Path $report)) { throw "Start ${run}: Sondra hat keinen Bericht geschrieben." }
            $seen = Get-Content $report -Raw | ConvertFrom-Json
            Write-Host "Start ${run}:"
            $seen | Format-List
            if ($seen.error) { throw "Start ${run} fehlgeschlagen: $($seen.error)" }
            if (-not $seen.isolated) { throw "Start ${run}: Seite nicht isoliert, FFmpeg liefe nur einfädig." }
            if ($seen.tools -lt 10) { throw "Start ${run}: nur $($seen.tools) Werkzeuge sichtbar." }
          }
          Write-Host 'Installiert, gestartet, Sondra im eigenen Fenster geladen.'

      - name: Show the app's log
        if: always()
        shell: pwsh
        run: Get-Content (Join-Path $env:APPDATA 'Sondra\sondra.log') -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: Sondra-Setup
          path: release/Sondra-Setup-*.exe
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zur Version $version in package.json."
          }
          # A release that already exists is left as it is: its files are
          # what was published, and a rerun for the Store upload below must
          # not fail on it.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag gibt es schon, bleibt unverändert."
            exit 0
          }
          $setup = Get-ChildItem release -Filter 'Sondra-Setup-*.exe' | Select-Object -First 1
          Copy-Item $setup.FullName release\Sondra-Setup.exe

          $notes = @"
          Sondra für Windows, Version $version.

          **Installieren:** Sondra-Setup.exe herunterladen und ausführen. Sondra installiert sich nur für das eigene Benutzerkonto, ohne Administratorrechte, und legt einen Eintrag im Startmenü und eine Verknüpfung auf dem Desktop an.

          **Stille Installation:** ``Sondra-Setup-$version.exe /S``

          Das Setup ist nicht signiert. Windows SmartScreen kann beim ersten Start warnen („Weitere Informationen“ → „Trotzdem ausführen“), und die intelligente App-Steuerung blockiert unsignierte Setups ganz.

          Datenschutz: https://lizge.ch/datenschutz.html
          "@
          # On a manual run the tag does not exist yet; --target creates it on
          # exactly the commit that was just built and tested.
          gh release create $tag $setup.FullName release\Sondra-Setup.exe `
            --target $env:GITHUB_SHA --title "Sondra $version" --notes $notes

      # The Microsoft Store refuses an installer URL that redirects, and every
      # GitHub release download does. Vercel Blob serves the file directly.
      # Needs the repository secret BLOB_READ_WRITE_TOKEN (from the Blob store
      # in the Vercel project); without it a tag build skips this quietly.
      - name: Put the installer on Vercel Blob
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release || inputs.store
        shell: pwsh
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if (-not $env:BLOB_READ_WRITE_TOKEN) {
            $message = 'Repository-Secret BLOB_READ_WRITE_TOKEN fehlt: kein Upload auf Vercel Blob.'
            if ('${{ inputs.store }}' -eq 'true') { throw $message }
            Write-Warning $message
            exit 0
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $setup = Get-ChildItem release -Filter "Sondra-Setup-$version.exe" | Select-Object -First 1
          node desktop/upload-blob.mjs $setup.FullName $version
          if ($LASTEXITCODE -ne 0) { throw 'Upload auf Vercel Blob fehlgeschlagen.' }
